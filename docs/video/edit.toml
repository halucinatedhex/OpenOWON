# The highlight reel's edit list: `python3 scripts/reel.py` renders it to
# build/reel/reel.mp4 (1080x1920, 30 fps). One [[beat]] per beat of
# docs/video-plan.md, in order; captions must match the plan's.
#
# Per beat:
#   caption   burned in above the screen ("\n" breaks a line)
#   seconds   its length when the clip is missing (a simulator still stands in)
#   still     the stand-in still in build/ (without .png); none = a title card
#   music     false keeps the music out (the beeps are the sound); default true
#   [[beat.part]]  one or more clips, played in turn under the one caption:
#     clip    file in the footage folder (--footage, default footage/)
#     in, out seconds into the clip (out defaults to in + seconds)
#     slow    1 = real time; 8 = 8x slow motion (a 240 fps clip played at
#             30 fps; out - in is then 1/8 of the beat's length)
#     audio   false mutes the clip (slowed clips are muted unless true)
#     zoom    1 = fill the frame; 1.3 crops in further
#     focus   [x, y], 0-1: where the crop sits when zoomed (default centre)
#
# `python3 scripts/reel.py beeps <clip>` lists a clip's beeps, to place
# in/out on beats 1-5.

[[beat]]
caption = "Stock: 9 s to settle.\nMine: watch."
seconds = 4
still = "sim-reel-01-ohms"
music = false
  [[beat.part]]
  clip = "b01-ohms.mov"
  in = 0.0
  slow = 1

