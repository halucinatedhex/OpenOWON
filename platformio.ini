; OWON XDM1241 custom firmware
; Digital board: XDM1041_dig_v1.7  |  MCU: GD32F303CCT6A (Cortex-M4, 256K flash, 48K SRAM)

[platformio]
default_envs = xdm1241

; ---------------------------------------------------------------- on target --
[env:xdm1241]
platform = https://github.com/CommunityGD32Cores/platform-gd32.git
board     = genericGD32F303CC
framework = spl

upload_protocol = jlink
debug_tool      = jlink
debug_init_break = tbreak main
monitor_speed   = 115200

; Linked at 0x08002800, behind OWON's bootloader (docs/boot.md).
board_build.ldscript = linker/app.ld

; __SYSTEM_CLOCK_IRC8M: the framework's SystemInit leaves the core on the
; internal 8 MHz oscillator; hal_early_init() then raises it to 72 MHz after
; setting flash wait states. The framework default (120 MHz from the crystal)
; would hang forever on a board without the crystal.
; -u _printf_float: readings are formatted with %f (newlib-nano drops it).
; NOTE: the GD32 platform appends -Os after these flags and the last one
; wins, so "-Og" below has no effect: every build here is -Os unless it
; unflags -Os (xdm1241-ui does, for -O2). Found 2026-11-11.
build_flags =
    -Wall -Wextra
    -Og -g3
    -DGD32F30X_HD
    -D__SYSTEM_CLOCK_IRC8M=8000000U
    -Wl,-u,_printf_float

; Host-only simulator code must never reach the meter.
lib_ignore = sim

; src/dumper/ is its own image (env:xdm1241-dumper), never part of the app.
build_src_filter = +<*> -<dumper/>

; Flashing goes through scripts/flash.sh so the backup guard always applies.
; `pio run -t upload` is deliberately NOT the documented path.

; The full application on the v2-derived pin map. Flash only after the pins
; are confirmed on this board (lib/hal/hal_pins.h).
[env:xdm1241-bench]
extends = env:xdm1241
build_flags =
    ${env:xdm1241.build_flags}
    -DHAL_TRUST_V2_PINS

; The pin-free build plus the serial port: the first thing to install on a
; readout-protected meter, over OWON's bootloader (scripts/serial-update.py).
; Logs on the serial port; answers *IDN? and DIAG:BOOT? (scripts/read-boot.py).
[env:xdm1241-serial]
extends = env:xdm1241
build_flags =
    ${env:xdm1241.build_flags}
    -DHAL_SERIAL_CONSOLE

; Serial console + panel only: draws a test pattern to confirm the panel pins
; and init on the v3 board (HAL_PANEL_TEST, lib/hal/hal_pins.h).
[env:xdm1241-panel]
extends = env:xdm1241
build_flags =
    ${env:xdm1241.build_flags}
    -DHAL_SERIAL_CONSOLE
    -DHAL_PANEL_TEST
    -DHAL_KEYPAD_TEST
    -DHAL_BEEPER_TEST
    -DHAL_BACKLIGHT_TEST
    -DHAL_AFE_PROBE

; The whole application on the real panel, keys and beeper, with the HY3131
; replaced by lib/sim's model for the functions not yet confirmed. Settings,
; user calibration and the data log are stored in flash: the dump of our
; meter (backups/20261110-210942-flash) shows 0x08030000-0x0803C7FF erased,
; and every area-5 install erases them anyway (docs/bootloader.md).
[env:xdm1241-ui]
extends = env:xdm1241
; -O2: at -Og a full redraw took 243 ms on the meter (2026-11-11). The base
; flags are spelled out, not inherited: "-Og -g3" is one token there, so
; build_unflags can't take -Og out of it. The GD32 platform also appends -Os
; after our flags (last wins), so that has to be unflagged too.
build_unflags = -Os
build_flags =
    -Wall -Wextra
    -O2 -g3
    -DGD32F30X_HD
    -D__SYSTEM_CLOCK_IRC8M=8000000U
    -Wl,-u,_printf_float
    -I lib/sim
    -DHAL_SERIAL_CONSOLE
    -DHAL_PANEL_TEST
    -DHAL_KEYPAD_TEST
    -DHAL_BEEPER_TEST
    -DHAL_BACKLIGHT_TEST
    -DHAL_RTC_TEST
    -DHAL_BATTERY_TEST
    -DHAL_SIM_AFE
    -DHAL_AFE_PROBE
    -DHAL_AFE_DCV_REAL
    -DHAL_STORE_ENABLED=1
    -DHAL_LOG_ENABLED=1

; The flash dumper: one 10 KB pack, so installing it over OWON's bootloader
; overwrites as little of stock as possible; then it reads all 256 KB out over
; serial (src/dumper/dumper.c, docs/install.md). Links lib/console only.
[env:xdm1241-dumper]
extends = env:xdm1241
build_src_filter = -<*> +<dumper/>
build_flags =
    -Wall -Wextra
    -Os
    -DGD32F30X_HD
    -D__SYSTEM_CLOCK_IRC8M=8000000U
lib_ignore = sim, app, hal, ui, measure, afe, display, store, scpi, datalog, keypad

; ------------------------------------------------------------ host testing --
; Logic that does not touch registers is compiled for the Mac and unit-tested
; here. No hardware, no probe, millisecond feedback.
[env:native]
platform      = native
test_framework = unity
build_flags   = -Wall -Wextra -std=c11 -I lib/measure -I lib/ui -I lib/afe -I lib/display -I lib/app -I lib/sim -I lib/store -I lib/scpi -I lib/datalog -I lib/console -I lib/keypad -DUNITY_INCLUDE_DOUBLE
test_build_src = no
