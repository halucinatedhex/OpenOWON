# OpenOCD target: GigaDevice GD32F303CC (Cortex-M4, 256 KB flash, 48 KB SRAM)
# Used for non-J-Link probes (ST-Link, CMSIS-DAP); J-Link has native support.
# The GD32F30x presents an STM32F103-compatible DAP and flash controller
# (an ST-Link reads its device ID as 0x414, STM32F10x high density).

# SWD on probes that offer a choice. An ST-Link V2 runs as a high-level
# adapter (hla), which brings its own hla_swd; swj-dp.tcl handles both.
if { [adapter name] ne "hla" } { transport select swd }
source [find target/swj-dp.tcl]

set _CHIPNAME gd32f303cc
set _WORKAREASIZE 0x8000

swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id 0x2ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -endian little -dap $_CHIPNAME.dap

$_CHIPNAME.cpu configure \
    -work-area-phys 0x20000000 \
    -work-area-size $_WORKAREASIZE \
    -work-area-backup 0

# Explicit 256 KB bank: GD32 parts can misreport size to autodetection.
flash bank $_CHIPNAME.flash stm32f1x 0x08000000 0x40000 0 0 $_CHIPNAME.cpu

# Clone ST-Links often have no working reset line; nothing read-only needs it.
# Ours (V2J37S7) has none: its RST pin never drives NRST. Hold reset by hand
# instead (scripts/connect-reset.sh).
reset_config none
adapter speed 1000

# ---- helpers ----------------------------------------------------------------
# OpenOCD 0.12 as packaged by Homebrew has no `mrw`. Read one 32-bit word,
# trying read_memory first and falling back to parsing mdw. Errors propagate,
# so a read the chip refuses (readout protection) is reported, not faked.
proc xdm_rd32 {addr} {
    if {![catch {set v [read_memory $addr 32 1]}]} { return [lindex $v 0] }
    if {![catch {set v [gd32f303cc.cpu read_memory $addr 32 1]}]} { return [lindex $v 0] }
    set s [capture "mdw $addr"]
    if {[regexp {:\s*([0-9a-fA-F]{8})} $s -> w]} { return [expr {"0x$w"}] }
    error "read of $addr failed"
}

proc xdm_show {label addr} {
    if {[catch {set v [xdm_rd32 $addr]}]} {
        echo [format "%-11s %08x: READ FAILED" $label $addr]
    } else {
        echo [format "%-11s %08x: %08x" $label $addr $v]
    }
}

# Identity and readout-protection status. Reads only. FMC_OBSTAT is a
# peripheral register, so it answers even when flash reads are refused.
proc xdm_identify {} {
    xdm_show IDCODE     0xE0042000
    xdm_show FMC_OBSTAT 0x4002201C
    xdm_show OB_SPC     0x1FFFF800
    xdm_show FlashSize  0x1FFFF7E0
    xdm_show UID0       0x1FFFF7E8
    xdm_show flash+0    0x08000000
    xdm_show app+0      0x08002800
    if {[catch {set ob [xdm_rd32 0x4002201C]}]} {
        echo "PROTECTION  unknown (FMC_OBSTAT unreadable)"
        return unknown
    }
    if {$ob & 0x2} {
        echo "PROTECTION  ON  (FMC_OBSTAT.SPC = 1): flash cannot be read over SWD"
        return on
    }
    echo "PROTECTION  off (FMC_OBSTAT.SPC = 0)"
    return off
}
